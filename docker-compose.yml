# Stack de LibriGest: db (PostgreSQL) + web (Flask/gunicorn). Variables con valor por defecto; se pueden fijar en .env.
services:
  # Base de datos PostgreSQL; al crear el volumen por primera vez aplica db/*.sql (esquema y datos base)
  db:
    image: postgres:16-alpine
    restart: unless-stopped  # RNF-12: vuelve solo tras un fallo o reinicio del servidor
    command: ["postgres", "-c", "timezone=${TZ:-America/Mexico_City}"]  # fechas locales: el navegador muestra la hora sin desfase
    # Credenciales/base iniciales de PostgreSQL (solo se aplican al inicializar el volumen)
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-librigest}
      POSTGRES_USER: ${POSTGRES_USER:-librigest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-librigest}
    volumes:
      # Datos persistentes de PostgreSQL (volumen con nombre, ver seccion volumes al final)
      - pgdata:/var/lib/postgresql/data
      # Scripts de inicializacion: se ejecutan en orden alfabetico solo con el volumen vacio (recrear_db.py los reaplica)
      - ./db:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups  # RNF-02: destino de respaldos (scripts/respaldo.py escribe aqui desde el host)
    # Listo cuando pg_isready conecta; web espera este estado (depends_on: service_healthy)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Aplicacion Flask (API + frontend estatico) construida con el Dockerfile local
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # host:contenedor; la app queda en http://localhost:8000 (WEB_PORT cambia el puerto del anfitrion)
    ports:
      - "${WEB_PORT:-8000}:8000"
    # No arranca hasta que PostgreSQL pase su healthcheck. Ollama solo debe haber iniciado: sin el, el asistente
    # responde con sus reglas (la app no depende de la IA).
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    # Configuracion de la aplicacion (ver app/config.py)
    environment:
      TZ: ${TZ:-America/Mexico_City}
      # Cadena de conexion a PostgreSQL por la red interna de compose (host db)
      DATABASE_URL: postgresql://${POSTGRES_USER:-librigest}:${POSTGRES_PASSWORD:-librigest}@db:5432/${POSTGRES_DB:-librigest}
      # Clave de firma de sesiones: CAMBIAR en cualquier entorno que no sea de desarrollo
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      # Parametros de negocio; mismos valores por defecto que app/config.py
      TIPO_CAMBIO_USD_MXN: ${TIPO_CAMBIO_USD_MXN:-18.00}
      PRESUPUESTO_MENSUAL_USD: ${PRESUPUESTO_MENSUAL_USD:-5000}
      ESPERA_DIAS_RESERVA: ${ESPERA_DIAS_RESERVA:-2}
      # Seguridad (docs/operacion.md): token de recuperacion visible en la API solo en demostracion; HTTPS=true tras un proxy TLS
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}  # procesos de gunicorn (una por nucleo)
      DEMO_MOSTRAR_TOKEN: ${DEMO_MOSTRAR_TOKEN:-true}
      HTTPS: ${HTTPS:-false}
      # Asistente con IA (D-13): modelo local en el servicio ollama; ASISTENTE_IA=0 lo desactiva (solo reglas)
      ASISTENTE_IA: ${ASISTENTE_IA:-1}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-20}  # segundos por respuesta; al vencer se usan las reglas
    # Mismo chequeo que el HEALTHCHECK del Dockerfile (GET /api/health); start_period da tiempo a gunicorn
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Servidor de modelos de lenguaje (Ollama) para el asistente (D-13). El modelo lo descarga scripts/levantar.py (ollama pull). Sin puerto publicado: solo web lo usa por la red interna
  ollama:
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    # Para probarlo desde el anfitrion (curl http://localhost:11434/api/tags) descomenta:
    # ports:
    #   - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 10m   # el modelo queda cargado 10 min tras la ultima pregunta (la siguiente responde mas rapido)
      OLLAMA_NUM_PARALLEL: 1   # una respuesta a la vez: reduce la memoria usada
      OLLAMA_MAX_LOADED_MODELS: 1
    # El modelo por defecto (qwen2.5:1.5b) ocupa ~1.4 GB en memoria; este tope protege al equipo con modelos mas grandes
    mem_limit: ${OLLAMA_MEM_LIMIT:-2g}
    volumes:
      # Modelos descargados (~1 GB el modelo por defecto): sobreviven a `down`; se borran con `down -v`
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

# Volumenes con nombre: sobreviven a `docker compose down` (se borran solo con `down -v`)
volumes:
  pgdata:
  ollama_models:
